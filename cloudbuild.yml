
steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        docker build -t northamerica-south1-docker.pkg.dev/microservices-504519/image-registry/auth-ms -f dockerfile.prod --platform=linux/amd64 --build-arg AUTH_DATABASE_URL=$$DATABASE_URL .
    secretEnv: ['DATABASE_URL']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'northamerica-south1-docker.pkg.dev/microservices-504519/image-registry/auth-ms',
      ]

availableSecrets:
  secretManager:
  - versionName: projects/716817249565/secrets/auth_database_url/versions/1
    env: 'DATABASE_URL'